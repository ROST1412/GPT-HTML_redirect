<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>高速リダイレクトページ</title>
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial;background:#f6f8fb;margin:0;color:#111;}
  .wrap{max-width:720px;margin:6vh auto;background:#fff;border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,0.08);padding:24px;}
  .urlbox,.timebox{display:flex;gap:8px;margin-bottom:20px;}
  input{flex:1;padding:8px 10px;font-size:15px;border:1px solid #ccc;border-radius:6px;}
  button{padding:8px 14px;font-size:15px;border:0;border-radius:6px;background:#007aff;color:#fff;cursor:pointer;}
  .btns{display:flex;gap:10px;margin-top:10px;}
  .btn{flex:1;padding:12px;border-radius:10px;font-size:16px;}
  .open{background:#0066ff;color:white;}
  .safari{background:#1d1d1d;color:white;}
  #timer{position:fixed;right:16px;bottom:16px;background:rgba(0,0,0,0.8);color:#fff;padding:8px 14px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .2s;}
  #timer.show{opacity:1;}
  #stopBtn{background:#ff4d4d;color:#fff;border:none;border-radius:16px;padding:4px 8px;font-size:12px;cursor:pointer;}
</style>
</head>
<body>
  <div class="wrap">
    <h2>高速リダイレクトテスト</h2>
    <p>形式：<code>?url=URL&t=秒数&s=0または1</code></p>

    <div class="urlbox">
      <input id="urlInput" placeholder="URL (https://...)" />
      <button id="changeBtn">URLを変更する</button>
    </div>
    <div class="timebox">
      <input id="timeInput" type="number" min="0" placeholder="秒数 (0=即時)" />
      <button id="timeBtn">タイマー変更</button>
      <button id="removeTimeBtn" style="background:#999;">タイマー削除</button>
    </div>
    <label><input type="checkbox" id="safariCheck" /> Safariで開くを使用</label>

    <div class="btns">
      <button id="openBtn" class="btn open">リンクへ移動</button>
      <button id="safariBtn" class="btn safari">Safariで開く</button>
    </div>
  </div>

  <div id="timer"><span id="timerText"></span> <button id="stopBtn">停止</button></div>

  <script>
  (()=> {
    const p=new URLSearchParams(location.search);
    const url=p.get("url"), t=parseInt(p.get("t"),10)||0, s=parseInt(p.get("s"),10)||0;
    const safariCheck=document.getElementById("safariCheck");
    safariCheck.checked = s===1;

    const timer=document.getElementById("timer"), timerText=document.getElementById("timerText");
    const stopBtn=document.getElementById("stopBtn");
    let timeoutId=null, startTime=null, remaining=t;

    const decoded=url?decodeURIComponent(url):"";
    const go=()=>{
      if(safariCheck.checked){
        const a=document.createElement("a");
        a.href=decoded; a.target="_blank";
        document.body.appendChild(a);
        a.click();
      } else {
        location.href=decoded;
      }
    };

    if(url){
      if(t===0){
        go(); // 即座に実行
      } else if(t>0){
        remaining=t;
        timer.classList.add("show");
        timerText.textContent=`${remaining} 秒後に移動します…`;
        const countdown=()=>{
          remaining--;
          if(remaining<=0){go();}
          else {
            timerText.textContent=`${remaining} 秒後に移動します…`;
            timeoutId=setTimeout(countdown,1000);
          }
        };
        timeoutId=setTimeout(countdown,1000);
      }
    }

    stopBtn.onclick=()=>{if(timeoutId){clearTimeout(timeoutId);timerText.textContent="⏸ 停止しました";}};

    document.getElementById("openBtn").onclick=()=>{if(url)location.href=decoded;};
    document.getElementById("safariBtn").onclick=()=>{if(url)window.open(decoded,"_blank");};

    const changeBtn=document.getElementById("changeBtn");
    const timeBtn=document.getElementById("timeBtn");
    const removeTimeBtn=document.getElementById("removeTimeBtn");
    const urlInput=document.getElementById("urlInput");
    const timeInput=document.getElementById("timeInput");

    changeBtn.onclick=()=>{
      const u=urlInput.value.trim(); if(!u) return alert("URLを入力");
      const tVal=timeInput.value?`&t=${timeInput.value}`:"";
      const sVal=safariCheck.checked?"&s=1":"&s=0";
      location.href=`${location.pathname}?url=${encodeURIComponent(u)}${tVal}${sVal}`;
    };

    timeBtn.onclick=()=>{
      const u=urlInput.value.trim()||url;
      const newT=parseInt(timeInput.value,10)||0;
      const sVal=safariCheck.checked?"&s=1":"&s=0";
      location.href=`${location.pathname}?url=${encodeURIComponent(u)}&t=${newT}${sVal}`;
    };

    removeTimeBtn.onclick=()=>{
      const u=urlInput.value.trim()||url;
      const sVal=safariCheck.checked?"&s=1":"&s=0";
      location.href=`${location.pathname}?url=${encodeURIComponent(u)}${sVal}`;
    };
  })();
  </script>
</body>
</html>
