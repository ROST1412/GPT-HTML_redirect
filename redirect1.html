<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>URLリダイレクトツール</title>
<style>
  body {
    font-family: sans-serif;
    text-align: center;
    margin: 40px;
    background-color: #fafafa;
  }
  input, button {
    font-size: 1rem;
    margin: 6px;
    padding: 8px;
  }
  #timerBox {
    position: fixed;
    right: 15px;
    bottom: 15px;
    font-size: 0.9rem;
    background: rgba(0,0,0,0.6);
    color: #fff;
    padding: 8px 12px;
    border-radius: 8px;
    display: none;
  }
  #overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(255,255,255,0.9);
    justify-content: center;
    align-items: center;
    font-size: 1.4rem;
    animation: fadeIn 0.3s ease forwards;
  }
  #overlay.show { display: flex; }
  @keyframes fadeIn { from {opacity:0;} to {opacity:1;} }
  #spin {
    border: 4px solid #ccc;
    border-top: 4px solid #333;
    border-radius: 50%;
    width: 30px;
    height: 30px;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 15px auto;
  }
  @keyframes spin { 100% { transform: rotate(360deg); } }
</style>
</head>
<body>
  <h2>Safariリダイレクトテスト</h2>
  <p>以下のURLを入力してSafariで開きます。</p>

  <div>
    <input id="urlInput" type="text" placeholder="https://example.com" size="40">
  </div>

  <div>
    <label>自動redirectタイマー(秒):</label>
    <input id="timerInput" type="number" value="0" min="0" style="width:60px;">
    <label><input type="checkbox" id="autoEnable"> 使用する</label>
  </div>

  <div>
    <button id="changeUrl">URLを変更する</button>
    <button id="safariBtn">Safariで開く</button>
  </div>

  <div id="timerBox"></div>

  <div id="overlay">
    <div>
      <div id="spin"></div>
      <div>Safariで開いています...</div>
    </div>
  </div>

<script>
(function(){
  const params = new URLSearchParams(location.search);
  const urlParam = params.get("url");
  const tParam = parseInt(params.get("t") || "0");
  const input = document.getElementById("urlInput");
  const timerInput = document.getElementById("timerInput");
  const autoEnable = document.getElementById("autoEnable");
  const timerBox = document.getElementById("timerBox");
  const safariBtn = document.getElementById("safariBtn");
  const overlay = document.getElementById("overlay");

  if (urlParam) input.value = urlParam;
  if (!isNaN(tParam)) timerInput.value = tParam;

  function openInSafari(url){
    overlay.classList.add("show");
    setTimeout(() => {
      try {
        const ua = navigator.userAgent;
        const isiOS = /iPhone|iPad|iPod/i.test(ua);
        const isSafari = /^((?!chrome|android).)*safari/i.test(ua);
        if (isiOS && !isSafari) {
          // iOSアプリ内ブラウザ対応
          const newWin = window.open(url, "_blank");
          if (!newWin) location.href = url;
        } else if (!isiOS && !isSafari) {
          // Windows / Chrome等
          window.open(url, "_blank");
        } else {
          location.href = url;
        }
      } catch (e) {
        location.href = url;
      }
    }, 100);
  }

  document.getElementById("changeUrl").onclick = () => {
    const newUrl = input.value.trim();
    const t = autoEnable.checked ? parseInt(timerInput.value || "0") : 0;
    location.href = `${location.origin}${location.pathname}?url=${encodeURIComponent(newUrl)}&t=${t}`;
  };

  safariBtn.onclick = () => {
    const url = input.value.trim();
    if (url) openInSafari(url);
  };

  // タイマー付きredirect
  if (urlParam && !isNaN(tParam) && autoEnable.checked) {
    if (tParam <= 0) {
      safariBtn.click();
    } else {
      let remaining = tParam;
      timerBox.style.display = "block";
      timerBox.textContent = `${remaining} 秒後にSafariで開きます…`;
      const interval = setInterval(() => {
        remaining--;
        if (remaining <= 0) {
          clearInterval(interval);
          timerBox.textContent = "Safariで開いています…";
          safariBtn.click(); // 擬似クリックでSafariを開く
        } else {
          timerBox.textContent = `${remaining} 秒後にSafariで開きます…`;
        }
      }, 1000);
    }
  }
})();
</script>
</body>
</html>
