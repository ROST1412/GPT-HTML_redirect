<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>リンク誘導ページ（Safari対応）</title>
<style>
body {
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial;
  background: #f6f8fb; margin: 0; color: #111;
}
.wrap {
  max-width: 720px; margin: 6vh auto; background: #fff;
  border-radius: 12px; box-shadow: 0 6px 20px rgba(0,0,0,0.08);
  padding: 24px;
}
h1 { font-size: 20px; margin: 0 0 10px; }
p { margin: 0 0 16px; color: #444; }
.target {
  word-break: break-all; background: #f0f4ff;
  padding: 10px; border-radius: 6px; margin-bottom: 16px;
}
.urlbox, .timebox { display: flex; gap: 8px; margin-bottom: 20px; }
input {
  flex: 1; padding: 8px 10px; font-size: 15px;
  border: 1px solid #ccc; border-radius: 6px;
}
button {
  padding: 8px 14px; font-size: 15px;
  border: 0; border-radius: 6px;
  background: #007aff; color: #fff; cursor: pointer;
}
.btns {
  display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px;
}
.btn {
  flex: 1; padding: 12px; border-radius: 10px; border: 0;
  font-size: 16px; cursor: pointer;
}
.btn.open { background: #0066ff; color: white; }
.btn.safari { background: #1d1d1d; color: white; }
.btn.app { background: #e2e8f0; color: #111; }
.btn.back { background: #ccc; color: #000; }
.note { margin-top: 14px; color: #666; font-size: 14px; }

#timer {
  position: fixed; right: 16px; bottom: 16px;
  background: rgba(0,0,0,0.8); color: #fff;
  padding: 8px 14px; border-radius: 20px;
  font-size: 14px; z-index: 9999;
  opacity: 0; transition: opacity .3s;
  display: flex; align-items: center; gap: 8px;
}
#timer.show { opacity: 1; }
#stopBtn {
  background: #ff4d4d; color: #fff; border: none;
  border-radius: 16px; padding: 4px 8px;
  font-size: 12px; cursor: pointer;
}

#overlay {
  position: fixed; inset: 0;
  background: rgba(255,255,255,0.9);
  display: flex; align-items: center; justify-content: center;
  z-index: 99999; opacity: 0; pointer-events: none;
  transition: opacity 0.3s ease;
}
#overlay.show { opacity: 1; pointer-events: auto; }
#overlay .text {
  font-size: 20px; color: #333; display: flex;
  align-items: center; gap: 10px;
}
.spinner {
  width: 20px; height: 20px;
  border: 3px solid #007aff; border-top-color: transparent;
  border-radius: 50%; animation: spin 1s linear infinite;
}
@keyframes spin { 100% { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="wrap">
  <h1>リンク誘導ページ（?url=形式 & t=秒数）</h1>
  <p>例：<code>?url=https://app.videostep.io&t=5</code></p>

  <div class="urlbox">
    <input id="urlInput" type="text" placeholder="新しいURLを入力 (例: https://...)" />
    <button id="changeBtn">URLを変更する</button>
  </div>

  <div class="timebox">
    <input id="timeInput" type="number" min="0" placeholder="自動移動までの秒数 (0で即移動)" />
    <button id="timeBtn">タイマーを変更</button>
    <button id="removeTimeBtn" style="background:#999;">タイマー削除</button>
  </div>

  <div><strong>誘導先URL：</strong>
    <div id="target" class="target">解析中…</div>
  </div>

  <div class="btns">
    <button id="openBtn" class="btn open">リンクへ移動</button>
    <button id="safariBtn" class="btn safari">Safariで開く</button>
    <button id="appBtn" class="btn app">アプリ起動を試す</button>
    <button id="backBtn" class="btn back">戻る</button>
  </div>

  <div class="note">アプリ内ブラウザでは挙動が制限される場合があります。</div>
</div>

<div id="timer"><span id="timerText"></span><button id="stopBtn">停止</button></div>
<div id="overlay"><div class="text"><div class="spinner"></div>Safariで開いています...</div></div>

<script>
(function(){
  const params = new URLSearchParams(location.search);
  const urlParam = params.get("url");
  const tParam = parseInt(params.get("t"), 10);
  const isiOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
  const isPC = !isiOS;

  const targetEl = document.getElementById("target");
  const input = document.getElementById("urlInput");
  const changeBtn = document.getElementById("changeBtn");
  const timeInput = document.getElementById("timeInput");
  const timeBtn = document.getElementById("timeBtn");
  const removeTimeBtn = document.getElementById("removeTimeBtn");
  const openBtn = document.getElementById("openBtn");
  const safariBtn = document.getElementById("safariBtn");
  const appBtn = document.getElementById("appBtn");
  const backBtn = document.getElementById("backBtn");
  const timerEl = document.getElementById("timer");
  const timerText = document.getElementById("timerText");
  const stopBtn = document.getElementById("stopBtn");
  const overlay = document.getElementById("overlay");

  let redirectTimer = null;
  let remaining = 0;

  function openInSafari(url) {
    overlay.classList.add("show");
    setTimeout(() => {
      if (isiOS) {
        window.location.href = url; // Safari / iOS では直接遷移
      } else {
        window.open(url, "_blank"); // Windows Chrome では新しいタブ
      }
    }, 500);
  }

  if (urlParam) {
    const decodedUrl = decodeURIComponent(urlParam);
    targetEl.textContent = decodedUrl;
    input.value = decodedUrl;

    if (!isNaN(tParam)) {
      if (tParam === 0) {
        openInSafari(decodedUrl);
      } else if (tParam > 0) {
        timeInput.value = tParam;
        remaining = tParam;
        timerEl.classList.add("show");
        timerText.textContent = `${remaining} 秒後にSafariで開きます…`;
        redirectTimer = setInterval(() => {
          remaining--;
          if (remaining <= 0) {
            clearInterval(redirectTimer);
            openInSafari(decodedUrl);
          } else {
            timerText.textContent = `${remaining} 秒後にSafariで開きます…`;
          }
        }, 1000);
      }
    }
  } else {
    targetEl.textContent = "URLパラメータ (?url=) が指定されていません。";
  }

  stopBtn.onclick = () => {
    if (redirectTimer) {
      clearInterval(redirectTimer);
      redirectTimer = null;
      timerText.textContent = "⏸ 自動移動を停止しました";
    }
  };

  openBtn.onclick = () => { if (urlParam) location.href = decodeURIComponent(urlParam); };
  safariBtn.onclick = () => { if (urlParam) openInSafari(decodeURIComponent(urlParam)); };
  appBtn.onclick = () => {
    const target = decodeURIComponent(urlParam || "");
    if (/^[a-zA-Z][a-zA-Z0-9+\-.]*:/.test(target) && !/^https?:/i.test(target)) {
      const ifr = document.createElement("iframe");
      ifr.style.display = "none"; ifr.src = target;
      document.body.appendChild(ifr);
      setTimeout(()=>ifr.remove(), 1500);
    } else { location.href = target; }
  };
  backBtn.onclick = () => { if (document.referrer) history.back(); };

  changeBtn.onclick = () => {
    const newUrl = input.value.trim();
    if (!newUrl) return alert("URLを入力してください");
    const tValue = timeInput.value ? `&t=${timeInput.value}` : "";
    location.href = `${location.pathname}?url=${encodeURIComponent(newUrl)}${tValue}`;
  };
  timeBtn.onclick = () => {
    const newTime = parseInt(timeInput.value, 10);
    if (isNaN(newTime) || newTime < 0) return alert("正しい秒数を入力してください (0以上)");
    const currentUrl = input.value.trim() || urlParam;
    if (!currentUrl) return alert("URLが未指定です");
    location.href = `${location.pathname}?url=${encodeURIComponent(currentUrl)}&t=${newTime}`;
  };
  removeTimeBtn.onclick = () => {
    const currentUrl = input.value.trim() || urlParam;
    if (!currentUrl) return alert("URLが未指定です");
    location.href = `${location.pathname}?url=${encodeURIComponent(currentUrl)}`;
  };
})();
</script>
</body>
</html>
