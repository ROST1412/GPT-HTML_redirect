<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>リンク誘導ページ</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial;
      background: #f6f8fb;
      margin: 0;
      color: #111;
    }
    .wrap {
      max-width: 720px;
      margin: 6vh auto;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.08);
      padding: 24px;
    }
    h1 { font-size: 20px; margin: 0 0 10px; }
    p { margin: 0 0 16px; color: #444; }
    .target {
      word-break: break-all;
      background: #f0f4ff;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 16px;
    }
    .btns { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
    .btn {
      flex: 1;
      padding: 12px;
      border-radius: 10px;
      border: 0;
      font-size: 16px;
      cursor: pointer;
    }
    .btn.open { background: #0066ff; color: white; }
    .btn.safari { background: #1d1d1d; color: white; }
    .btn.fallback { background: #e2e8f0; color: #111; }
    .btn.back { background: #ccc; color: #000; }
    .note { margin-top: 14px; color: #666; font-size: 14px; }
    .urlbox {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }
    .urlbox input {
      flex: 1;
      padding: 8px 10px;
      font-size: 15px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    .urlbox button {
      padding: 8px 14px;
      font-size: 15px;
      border: 0;
      border-radius: 6px;
      background: #007aff;
      color: #fff;
      cursor: pointer;
    }

    /* ✅ カウントダウン表示を右下に固定 */
    #timer {
      position: fixed;
      right: 16px;
      bottom: 16px;
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 14px;
      z-index: 9999;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    #timer.show {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>外部リンク誘導ページ</h1>
    <p>URLの形式：<code>/AAA.html/BBBBBBB/-t5</code> のように指定できます。</p>

    <div class="urlbox">
      <input id="urlInput" type="text" placeholder="ここに新しいURLを入力" />
      <button id="changeBtn">URLを変更する</button>
    </div>

    <div>
      <strong>誘導先URL：</strong>
      <div id="target" class="target">解析中…</div>
    </div>

    <div class="btns">
      <button id="openBtn" class="btn open">リンクへ移動（通常）</button>
      <button id="safariBtn" class="btn safari">Safariで開く</button>
      <button id="fallbackBtn" class="btn fallback">アプリ起動を試す</button>
      <button id="backBtn" class="btn back">戻る</button>
    </div>

    <div id="msg" class="note">
      ※ アプリ内ブラウザではリダイレクト後に真っ白になることがあります。<br>
      その場合は「戻る」ボタンでこのページに戻れます。
    </div>
  </div>

  <!-- ✅ カウントダウン用フロート要素 -->
  <div id="timer"></div>

  <script>
    (function(){
      const pathParts = location.pathname.split('/');
      // パスの最後が -t数字 の場合タイマー秒数取得
      let timerValue = null;
      const lastPart = pathParts[pathParts.length - 1];
      if (/^-t\\d+$/.test(lastPart)) {
        timerValue = parseInt(lastPart.replace('-t', ''), 10);
        pathParts.pop(); // -t〇 を削除
      }

      // HTMLファイル名の次の要素がリンクターゲット
      const htmlIndex = pathParts.findIndex(p => /\\.html?$/.test(p));
      let targetUrl = '';
      if (htmlIndex !== -1 && pathParts.length > htmlIndex + 1) {
        targetUrl = decodeURIComponent(pathParts[htmlIndex + 1]);
      }

      const targetEl = document.getElementById('target');
      const openBtn = document.getElementById('openBtn');
      const safariBtn = document.getElementById('safariBtn');
      const fallbackBtn = document.getElementById('fallbackBtn');
      const backBtn = document.getElementById('backBtn');
      const input = document.getElementById('urlInput');
      const changeBtn = document.getElementById('changeBtn');
      const timerEl = document.getElementById('timer');

      if (targetUrl) {
        targetEl.textContent = targetUrl;
        input.value = targetUrl;
      } else {
        targetEl.textContent = 'URL指定が見つかりません。上のボックスに入力してください。';
      }

      openBtn.onclick = () => { if (targetUrl) location.href = targetUrl; };
      safariBtn.onclick = () => { if (targetUrl) window.open(targetUrl, '_blank', 'noopener'); };
      fallbackBtn.onclick = () => {
        if (!targetUrl) return alert('ターゲットがありません');
        const iframe = document.createElement('iframe');
        iframe.style.display = 'none';
        iframe.src = targetUrl;
        document.body.appendChild(iframe);
        setTimeout(()=>iframe.remove(),1500);
      };
      backBtn.onclick = () => {
        if (document.referrer) {
          history.back();
        } else {
          alert('前のページ情報がありません。手動で戻ってください。');
        }
      };

      changeBtn.onclick = () => {
        const newUrl = input.value.trim();
        if (!newUrl) return alert('URLを入力してください');
        location.href = location.origin + location.pathname.split('.html')[0] + '.html/' + encodeURIComponent(newUrl);
      };

      // ✅ タイマー付き自動リダイレクト（右下表示）
      if (timerValue && targetUrl) {
        let remaining = timerValue;
        timerEl.textContent = `${remaining} 秒後に移動します…`;
        timerEl.classList.add('show');

        const interval = setInterval(() => {
          remaining--;
          if (remaining <= 0) {
            clearInterval(interval);
            timerEl.textContent = '移動中…';
            location.href = targetUrl;
          } else {
            timerEl.textContent = `${remaining} 秒後に移動します…`;
          }
        }, 1000);
      }
    })();
  </script>
</body>
</html>
